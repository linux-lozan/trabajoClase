<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Charlas · AdiTech Events</title>
  <link rel="icon" type="image/png" href="Imagen1.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body data-pagina="charlas">
  <header id="cabecera" class="cabecera"></header>

  <main>
    <section class="cab-pagina">
      <div class="contenedor">
        <p class="etiqueta">Agenda · programa completo</p>
        <h1>Charlas<sup id="numCharlas"></sup></h1>
        <p>Filtra por día, sala o ponente y reserva tu plaza antes de que se llene la sala.</p>
      </div>
    </section>

    <section class="seccion">
      <div class="contenedor">
        <div class="filtros">
          <label class="mono">Buscar
            <input type="search" id="buscador" placeholder="Título o ponente…" />
          </label>
          <label class="mono">Día
            <select id="filtroFecha"><option value="">Todas las fechas</option></select>
          </label>
          <label class="mono">Sala
            <select id="filtroSala"><option value="">Todas las salas</option></select>
          </label>
        </div>
        <ol id="listaCharlas" class="agenda"></ol>
        <p id="sinResultados" class="oculto centrado">No hay charlas que coincidan con la búsqueda.</p>
      </div>
    </section>
  </main>

  <footer id="pie" class="pie"></footer>
  <script src="js/datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
