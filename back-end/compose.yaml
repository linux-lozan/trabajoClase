services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../front-end/proyecto-react
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ../front-end/proyecto-react:/app
      - frontend_node_modules:/app/node_modules
    environment:
      API_PROXY_TARGET: http://web:80
      CHOKIDAR_USEPOLLING: "true"
    depends_on:
      - web

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sabitech}
      MYSQL_USER: ${DB_USERNAME:-ADI_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../data-base/sabitech_.sql:/docker-entrypoint-initdb.d/01-sabitech.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  mysql_data:
  frontend_node_modules: