services:
  web:
    build: .
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./app:/var/www/html

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sabitech}
      MYSQL_USER: ${DB_USERNAME:-ADI_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../data-base/sabitech_.sql:/docker-entrypoint-initdb.d/01-sabitech.sql:ro

volumes:
  mysql_data: